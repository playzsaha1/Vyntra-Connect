<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Vyntra Connect</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body class="auth-page">
  <div class="auth-card">
    <a href="index.html" class="back-link">← Back</a>

    <h1>Welcome to Vyntra</h1>
    <p>Create your account or log in to continue.</p>

    <form id="authForm">
      <input id="nameInput" type="text" placeholder="Display name" />
      <input id="usernameInput" type="text" placeholder="Username" />
      <input id="emailInput" type="email" placeholder="Email" required />
      <input id="passwordInput" type="password" placeholder="Password" required />

      <button id="signupBtn" type="button" class="primary-btn full">
        Sign Up
      </button>

      <button id="loginBtn" type="button" class="secondary-btn full">
        Login
      </button>
    </form>

    <p class="small-text">
      Firebase Auth is now being connected.
    </p>
  </div>

  <script type="module" src="auth.js"></script>
</body>
</html>
